<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#191a19" />
  <meta name="description" content="Party games, solo puzzles, and tools for the lab and ballpark, by Ben Shin. Pick something and open it in your browser." />
  <title>Ben's Games &amp; Tools</title>
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <a class="skip-link" href="#catalog">Skip to games and tools</a>
  <div class="shell">
    <header class="topbar">
      <h1><a class="wordmark" href="./">Ben's games &amp; tools</a></h1>
      <a class="source-link" href="https://github.com/tod2e/tod2e.github.io" target="_blank" rel="noreferrer">Source on GitHub <span aria-hidden="true">↗</span></a>
    </header>

    <main>
      <div class="intro">
        <p>Games and useful tools for your browser.</p>
        <button id="randomBtn" class="text-button" type="button" hidden>Random game <span aria-hidden="true">↗</span></button>
      </div>

      <section id="catalog" class="catalog" aria-label="Games and tools" tabindex="-1">
        <div id="catalogControls" class="catalog-controls" hidden>
          <div class="filter-row" role="group" aria-label="Filter games and tools">
            <button class="filter" data-filter="all" type="button" aria-pressed="true">All</button>
            <button class="filter" data-filter="game" type="button" aria-pressed="false">Games</button>
            <button class="filter" data-filter="tool" type="button" aria-pressed="false">Tools</button>
            <button class="filter" data-filter="pinned" type="button" aria-pressed="false">Pinned</button>
          </div>
          <label class="search-box" for="searchInput">
            <span class="sr-only">Search games and tools</span>
            <input id="searchInput" type="search" placeholder="Find something…" autocomplete="off" aria-controls="catalogGroups" />
            <kbd aria-hidden="true">/</kbd>
          </label>
        </div>
        <p id="catalogCount" class="catalog-count" role="status" aria-live="polite" aria-atomic="true"></p>
        <p id="pinStatus" class="pin-status" role="status" hidden></p>
        <div id="catalogGroups"></div>
        <button id="catalogMore" class="text-button catalog-more" type="button" aria-controls="catalogGroups" aria-expanded="false" hidden>Show all</button>
        <div id="emptyState" class="empty-state" hidden>
          <h2 id="emptyTitle">No matches.</h2>
          <p id="emptyHelp">Try a different search or choose another category.</p>
          <button id="resetBtn" class="text-button" type="button">Clear search and filters <span aria-hidden="true">↗</span></button>
        </div>
        <noscript>
          <section class="fallback">
            <h2>Games</h2>
            <ul>
              <li><a href="./truth-or-drink/">Truth or Drink</a></li>
              <li><a href="./wavelength/">Same Wavelength</a></li>
              <li><a href="./fishbowl/">Fishbowl</a></li>
              <li><a href="./rank-the-room/">Rank the Room</a></li>
              <li><a href="./impostor-word/">Impostor Word</a></li>
              <li><a href="./telephone-drawing/">Telephone Drawing</a></li>
              <li><a href="./bluff-box/">Bluff Box</a></li>
              <li><a href="./categories/">Categories</a></li>
              <li><a href="./codebreaker/">Codebreaker</a></li>
              <li><a href="./connect-four/">Connect Four</a></li>
            </ul>
            <h2>Tools</h2>
            <ul>
              <li><a href="./biocalc/">BioCalc</a></li>
              <li><a href="./nmr-toolbox/">NMR Toolbox</a></li>
              <li><a href="./md-planner/">MD Planner</a></li>
              <li><a href="./plate-planner/">Plate Planner</a></li>
              <li><a href="./lab-timers/">Lab Timers</a></li>
              <li><a href="./pitch-counter/">Pitch Counter</a></li>
            </ul>
            <p>These games and tools need JavaScript to run.</p>
          </section>
        </noscript>
      </section>
    </main>

    <footer class="footer">
      <span>Made by Ben Shin.</span>
      <span id="footerCount">Games &amp; tools for your browser.</span>
    </footer>
  </div>
  <script src="apps.js"></script>
  <script src="hub.js"></script>
</body>
</html>
